name: Wooosh
options:
  bundleIdPrefix: com.juliuspaetzke
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Ad hoc. Ohne "Developer ID Application"-Zertifikat ist keine
    # Notarisierung möglich — siehe README, Abschnitt Verteilung.
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    # Kein App Sandbox: Wooosh muss Pfade außerhalb seines Containers lesen
    # und löschen. Mit Sandbox wäre die App funktionslos.
    ENABLE_APP_SANDBOX: NO

targets:
  Wooosh:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/schild.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Wooosh
        PRODUCT_BUNDLE_IDENTIFIER: com.juliuspaetzke.wooosh
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: schild
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

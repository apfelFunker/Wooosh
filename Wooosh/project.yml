name: Wooosh
options:
  bundleIdPrefix: com.juliuspaetzke
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    # The team ID does not live in the repository. build-release.sh passes it
    # on to xcodebuild from $DEVELOPMENT_TEAM.
    # Signed automatically. The Developer ID identity is not set here — it
    # comes in with `xcodebuild -exportArchive` and method "developer-id", which
    # re-signs the app. Xcode refuses to have both at once.
    CODE_SIGN_STYLE: Automatic
    # Notarising requires the hardened runtime.
    ENABLE_HARDENED_RUNTIME: YES
    # No app sandbox: Wooosh has to read and delete paths outside its own
    # container. Sandboxed, the app would do nothing at all.
    ENABLE_APP_SANDBOX: NO

targets:
  Wooosh:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/schild.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Wooosh
        PRODUCT_BUNDLE_IDENTIFIER: com.juliuspaetzke.wooosh
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: schild
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

name: Wooosh
options:
  bundleIdPrefix: com.juliuspaetzke
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9FZVQ84P7B
    # Automatisch signiert. Die Developer-ID-Identität wird nicht hier gesetzt —
    # sie kommt beim `xcodebuild -exportArchive` mit method "developer-id" dazu,
    # das die App neu signiert. Beides gleichzeitig lehnt Xcode ab.
    CODE_SIGN_STYLE: Automatic
    # Notarisierung setzt die Hardened Runtime voraus.
    ENABLE_HARDENED_RUNTIME: YES
    # Kein App Sandbox: Wooosh muss Pfade außerhalb seines Containers lesen
    # und löschen. Mit Sandbox wäre die App funktionslos.
    ENABLE_APP_SANDBOX: NO

targets:
  Wooosh:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/schild.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Wooosh
        PRODUCT_BUNDLE_IDENTIFIER: com.juliuspaetzke.wooosh
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: schild
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
